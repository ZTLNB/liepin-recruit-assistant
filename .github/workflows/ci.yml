name: CI

# Everything here is offline and local: the store is SQLite in a temp dir and
# the only data source is a CSV/JSON file the test writes itself. Nothing
# touches the recruiting platform, and nothing sends anything.
#
# The CLI deliberately keeps human approval in the loop, so the tests assert
# that behaviour rather than the absence of it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pinned on purpose: both tools add rules every few weeks, and an unpinned
# install turns into a red build unrelated to the commit that triggered it.
env:
  RUFF_VERSION: '0.16.8'
  MYPY_VERSION: '2.3.1'

jobs:
  test:
    name: test (python ${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the declared floor. 3.13 is what the project is developed on.
        # Windows and macOS get one cell each because path handling and
        # SQLite file locking are the parts most likely to differ.
        os: [ubuntu-latest]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Show the interpreter
        run: python -VV

      # Tests first: they add src/ to sys.path themselves, so a packaging
      # problem cannot mask the test result.
      - name: Run the test suite
        run: python -m unittest discover -s tests

      - name: Verify the package installs
        run: python -m pip install -e .

      - name: Verify the console entry point works
        run: |
          recruit --help

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install the linters
        run: python -m pip install "ruff==$RUFF_VERSION" "mypy==$MYPY_VERSION"

      # Both read their settings from pyproject.toml.
      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy
