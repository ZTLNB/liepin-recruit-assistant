[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recruit-assistant"
version = "1.0.0"
description = "猎聘招聘助手 —— 半自动化招聘流水线:JD 解析、简历匹配、话术草稿、招聘日报"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ZTLNB" }]
keywords = ["recruiting", "hr", "liepin", "招聘", "resume-matching", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
# 运行时零第三方依赖 —— 只用标准库
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
recruit = "recruit_assistant.cli:main"

[project.urls]
Homepage = "https://github.com/ZTLNB/liepin-recruit-assistant"
Repository = "https://github.com/ZTLNB/liepin-recruit-assistant"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
